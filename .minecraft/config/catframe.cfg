# Configuration file

##########################################################################################################
# dev
#--------------------------------------------------------------------------------------------------------#
# Developer things
##########################################################################################################

dev {
    # Set to true to enable debug logging for the render system (Mixin logs, etc.). [default: false]
    B:debugLogThingsEnabled=false

    # Enable builtin example resourcepack [default: false]
    B:enableBuiltinExampleResource=false
}


##########################################################################################################
# experimental
#--------------------------------------------------------------------------------------------------------#
# Experimental settings. May break compatibility with third-party render mods.
##########################################################################################################

experimental {
}


##########################################################################################################
# features
#--------------------------------------------------------------------------------------------------------#
# Some examples and useful small things.
##########################################################################################################

features {
    # Set to true to enable the Bluey plushy item. [default: false]
    B:enableBlueyPlushy=false

    # Set to true to show the CatFrame welcome toast when joining a world. [default: true]
    B:welcomeToast=true
}


