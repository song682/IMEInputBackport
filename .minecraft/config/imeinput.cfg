# Configuration file

general {
    # IME backend: AUTO = match the platform (Windows: try TSF then fall back to IMM32; Linux: pick IBus or Fcitx5 by the IME environment with mutual fallback); TSF / IMM32 = force that backend (Windows only); IBUS / FCITX = force that backend (Linux only). IME 后端：AUTO = 按平台自动匹配（Windows 先试 TSF 失败降级 IMM32；Linux 按 IME 环境变量在 IBus / Fcitx 间择一并互为兜底）；TSF / IMM32 = 强制指定后端（仅 Windows）；IBUS / FCITX = 强制指定后端（仅 Linux）。 [default: AUTO]
    S:backend=AUTO

    # Candidate bar appearance: true = the OS/IME draws its native candidate window; false = hide it and let the mod self-draw the candidate box. Needs a game restart. 候选条外观：true = 系统/输入法原生候选窗；false = 隐藏原生候选窗，由模组自绘候选框。修改后需重启游戏。 [default: true]
    B:candidateNativeBar=true
}


